# gzip compression for text-based assets (JS/CSS/HTML/JSON/SVG/fonts).
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    application/javascript
    application/x-javascript
    text/javascript
    text/css
    text/plain
    text/xml
    application/json
    application/manifest+json
    application/xml
    application/wasm
    image/svg+xml
    # ttf/otf are uncompressed sfnt and do benefit. woff and woff2 are omitted
    # on purpose: their glyph tables are already compressed inside the container
    # (zlib per-table for woff, brotli whole-file for woff2), so recompressing
    # burns CPU on both ends for nothing.
    font/ttf
    font/otf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 307 https://$host$request_uri;
}

server {
    listen [::]:443 ssl;
    listen          443 ssl;

        # Protect against the BEAST attack by not using SSLv3 at all. If you need to support older browsers (IE6) you may need to add
    # SSLv3 to the list of protocols below.
    ssl_protocols   TLSv1.2;

    server_name     localhost;
    
    # Ciphers set to best allow protection from Beast, while providing forwarding secrecy, as defined by Mozilla - https://wiki.mozilla.org/Security/Server_Side_TLS#Nginx
    ssl_ciphers                ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-DSS-AES128-GCM-SHA256:kEDH+AESGCM:ECDHE-RSA-AES128-SHA256:ECDHE-ECDSA-AES128-SHA256:ECDHE-RSA-AES128-SHA:ECDHE-ECDSA-AES128-SHA:ECDHE-RSA-AES256-SHA384:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES256-SHA:ECDHE-ECDSA-AES256-SHA:DHE-RSA-AES128-SHA256:DHE-RSA-AES128-SHA:DHE-DSS-AES128-SHA256:DHE-RSA-AES256-SHA256:DHE-DSS-AES256-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:ECDHE-RSA-RC4-SHA:ECDHE-ECDSA-RC4-SHA:AES128:AES256:RC4-SHA:HIGH:!aNULL:!eNULL:!EXPORT:!DES:!3DES:!MD5:!PSK;
    ssl_prefer_server_ciphers  on;

    # Optimize SSL by caching session parameters for 10 minutes. This cuts down on the number of expensive SSL handshakes.
    # The handshake is the most CPU-intensive operation, and by default it is re-negotiated on every new/parallel connection.
    # By enabling a cache (of type "shared between all Nginx workers"), we tell the client to re-use the already negotiated state.
    # Further optimization can be achieved by raising keepalive_timeout, but that shouldn't be done unless you serve primarily HTTPS.
    ssl_session_cache    shared:SSL:10m; # a 1mb cache can hold about 4000 sessions, so we can hold 40000 sessions
    ssl_session_timeout  24h;

    # Use a higher keepalive timeout to reduce the need for repeated handshakes
    keepalive_timeout 300; # up from 75 secs default

    index index.html;

    ssl_certificate      /etc/nginx/certs/mpsserver-cert-public.crt;
    ssl_certificate_key  /etc/nginx/certs/mpsserver-cert-private.key;

    #charset koi8-r;
    #access_log  /var/log/nginx/host.access.log  main;

    # Long-lived caching, but only for names carrying a content hash
    # (chunk-XXXXXXXX.js, styles-XXXXXXXX.css, <font>-XXXXXXXX.woff2). A rebuild
    # changes the hash and therefore the URL, so a year is safe. Matching on the
    # extension alone would also pin unhashed files, and the enterprise build
    # sets outputHashing: none and has init.sh rewrite the JS in place at
    # container start — pinning those would serve one deployment's backend URLs
    # for a year. Nothing matches under that flavor, which is the correct result.
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        root       /usr/share/nginx/html;
        # One header, not `expires` + `add_header` (which emits two Cache-Control lines).
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA fallback: deep links like /devices/<guid> have no file on disk, so
        # hand them to index.html and let the Angular router resolve the route.
        # This replaces `error_page 404 /index.html`, which served the same shell
        # but kept the 404 status — so caches, proxies and uptime checks treated
        # every working deep link as a missing page. try_files rewrites
        # internally and returns 200.
        try_files $uri $uri/ /index.html;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }

}

