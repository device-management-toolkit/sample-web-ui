# gzip compression for text-based assets (JS/CSS/HTML/JSON/SVG/fonts).
gzip              on;
gzip_vary         on;
gzip_comp_level   6;
gzip_min_length   1024;
gzip_proxied      any;
gzip_types
    application/javascript
    application/x-javascript
    text/javascript
    text/css
    text/plain
    text/xml
    application/json
    application/manifest+json
    application/xml
    application/xml+rss
    application/wasm
    image/svg+xml
    # ttf/otf are uncompressed sfnt and do benefit. woff and woff2 are omitted
    # on purpose: their glyph tables are already compressed inside the container
    # (zlib per-table for woff, brotli whole-file for woff2), so recompressing
    # burns CPU on both ends for nothing.
    font/ttf
    font/otf;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Long-lived caching, but only for names carrying a content hash
    # (chunk-XXXXXXXX.js, styles-XXXXXXXX.css, <font>-XXXXXXXX.woff2). A rebuild
    # changes the hash and therefore the URL, so a year is safe. Matching on the
    # extension alone would also pin unhashed files, and the enterprise build
    # sets outputHashing: none and has init.sh rewrite the JS in place at
    # container start — pinning those would serve one deployment's backend URLs
    # for a year. Nothing matches under that flavor, which is the correct result.
    location ~* "-[A-Z0-9]{8}\.(?:js|css|woff2?)$" {
        root       /usr/share/nginx/html;
        # One header, not `expires` + `add_header` (which emits two Cache-Control lines).
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # SPA fallback: deep links like /devices/<guid> have no file on disk, so
        # hand them to index.html and let the Angular router resolve the route.
        # This replaces `error_page 404 /index.html`, which served the same shell
        # but kept the 404 status — so caches, proxies and uptime checks treated
        # every working deep link as a missing page. try_files rewrites
        # internally and returns 200.
        try_files $uri $uri/ /index.html;
    }

    # redirect server error pages to the static page /50x.html
    #
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
