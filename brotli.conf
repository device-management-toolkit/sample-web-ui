# Brotli compression for text-based assets — roughly 18% smaller than gzip on
# this app's main bundle. Requires the ngx_brotli filter module, so this file is
# installed into /etc/nginx/conf.d/ by the Dockerfile only after that module is
# built and loaded; a plain nginx image would abort on an unknown directive.
#
# gzip stays configured in nginx.conf as the fallback: nginx serves brotli to
# clients advertising `Accept-Encoding: br` and gzip to everyone else.
#
# Level 5 is the practical sweet spot for on-the-fly compression — near level-11
# ratios on text at a fraction of the CPU (11 is intended for static
# precompression, not per-request use).
brotli            on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types
    application/javascript
    application/x-javascript
    text/javascript
    text/css
    text/plain
    text/xml
    application/json
    application/manifest+json
    application/xml
    application/wasm
    image/svg+xml
    # ttf/otf are uncompressed sfnt and do benefit. woff and woff2 are omitted
    # on purpose: their glyph tables are already compressed inside the container
    # (zlib per-table for woff, brotli whole-file for woff2), so recompressing
    # burns CPU on both ends for nothing.
    font/ttf
    font/otf;
