<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Device Management Toolkit</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script>
      // Applies the stored look before first paint; ThemeService takes over once the app starts.
      ;['theme', 'palette'].forEach((key) => {
        const value = localStorage.getItem(key)
        if (/^[a-z]+$/.test(value ?? '')) document.documentElement.classList.add(`${value}-${key}`)
      })
    </script>
  </head>

  <body>
    <app-root></app-root>
  </body>
</html>
