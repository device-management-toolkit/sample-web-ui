<mat-sidenav-container autosize [dir]="direction()">

    <mat-sidenav mode="side" opened>
      <div class="sidenav-layout">
        <app-navbar></app-navbar>
        <app-nav-footer></app-nav-footer>
      </div>
    </mat-sidenav>
  }

  <mat-sidenav-content>
    <router-outlet></router-outlet>
  </mat-sidenav-content>
</mat-sidenav-container>
